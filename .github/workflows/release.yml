# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: CreateRelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: ./WhiteRabbitRend.sln

  # Configuration type to build.
  # You can convert this to a build matrix if you need coverage of multiple configuration types.
  # https://docs.github.com/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
  BUILD_CONFIGURATION: Release
  
jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        submodules: 'true'

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # Add additional options to the MSBuild command line here (like platform or verbosity level).
      # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Create artifact
      run: .\resources\package.bat

    - name: Upload workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: whiterabbit-renderer-${{ github.ref_name }}
        path: whiterabbit-renderer.zip
        if-no-files-found: error
        retention-days: 14

    - name: Create release and upload ZIP
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$env:GITHUB_REF_NAME" ".\whiterabbit-renderer.zip#whiterabbit-renderer.zip" --title "$env:GITHUB_REF_NAME" --generate-notes --verify-tag
